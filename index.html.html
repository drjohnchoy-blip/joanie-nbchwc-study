<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e5553"><title>Joanie’s NBC-HWC Exam Companion</title><style>
:root{--ink:#193c3c;--teal:#0d6661;--muted:#526e6c;--cream:#faf8f2;--line:#dce6e1;--coral:#d7806d;--light:#e9f3ef;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--teal)}header{background:#104e4d;color:white;padding:19px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font:600 22px Georgia,serif}header small{display:block;opacity:.8}nav{display:flex;gap:7px;flex-wrap:wrap}nav button{border:1px solid #78a19a;color:white;background:transparent;border-radius:24px;padding:8px 13px}nav button:hover,nav button[aria-current=page]{background:white;color:#104e4d}main{max-width:950px;margin:auto;padding:24px 18px 70px}h1,h2,h3{font-family:Georgia,serif;line-height:1.17}h1{font-size:clamp(32px,6vw,48px);margin:12px 0}h2{font-size:29px;margin:24px 0 10px}h3{font-size:22px;margin:20px 0 8px}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:750;font-size:12px;color:var(--teal)}.hero{background:linear-gradient(125deg,#e5f4ed,#fff7eb);padding:32px;border-radius:24px;border:1px solid var(--line)}.hero p{max-width:700px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin:20px 0}.card,.panel,.question{background:white;border:1px solid var(--line);border-radius:17px;padding:21px}.card h3{margin:7px 0}.card p{font-size:15px}.card button{margin-top:9px}.btn{border:0;border-radius:11px;background:var(--teal);color:white;padding:12px 17px;font-weight:700;min-height:44px}.btn:hover{background:#074b47}.btn.secondary{background:var(--light);color:var(--teal)}.btn.outline{border:1px solid var(--teal);background:white;color:var(--teal)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-block;background:var(--light);color:var(--teal);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700}.meter{height:10px;background:#e4e8e2;border-radius:20px;overflow:hidden}.meter span{display:block;height:100%;background:var(--teal)}.lesson{padding:16px 20px;border-left:4px solid var(--teal);background:white;border-radius:0 12px 12px 0;margin:15px 0}.lesson p{margin:8px 0}.callout{background:#fff4e9;border:1px solid #eecdb3;border-radius:12px;padding:16px 19px;margin:15px 0}.example{background:#e9f3ef;padding:18px;border-radius:14px;margin:14px 0}.example p{margin:7px 0}.question{margin:18px 0}.question h3{font:650 18px/1.45 system-ui;margin:7px 0 14px}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid #d8e2df;border-radius:12px;padding:12px;cursor:pointer}.option:hover{background:#f4faf7}.option input{width:19px;height:19px;flex-shrink:0;margin-top:4px;accent-color:var(--teal)}.feedback{margin-top:12px;padding:14px;border-radius:10px;background:#eff7f3}.feedback.wrong{background:#fff0ea}.feedback p{margin:5px 0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.stat{font:700 32px Georgia,serif}.small{font-size:14px}.hidden{display:none!important}.search{padding:13px;border-radius:10px;border:1px solid var(--line);width:100%;max-width:440px}.footer{border-top:1px solid var(--line);padding-top:25px;color:var(--muted);font-size:14px;margin-top:35px}.chapterhead{padding-bottom:12px;border-bottom:1px solid var(--line)}.checklist{padding-left:23px}.checklist li{margin:8px 0}.focus{font-weight:700;color:var(--teal)}@media(max-width:620px){header{padding:14px 17px}header strong{font-size:19px}nav{width:100%;overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap;font-size:13px}main{padding:17px 13px 65px}.hero{padding:22px}.card,.panel,.question{padding:17px}.btn{width:100%}.toolbar .btn{width:auto;flex:1}.row.between{align-items:flex-start}body{font-size:16px}}
</style></head><body><header><div><strong>🌺 Joanie’s Exam Companion</strong><small>Think like a coach. Choose like a coach.</small></div><nav id="nav"><button data-page="home">Home</button><button data-page="chapters">Deep Dives</button><button data-page="review">Missed Questions</button><button data-page="mock">Mock Exam</button><button data-page="tools">Quick Tools</button></nav></header><main id="app"></main><script>
const QUESTIONS=[{"id": "practice-0-0", "mode": "practice", "domain": 0, "stem": "A client starts by saying the dietitian referred them, but they do not want to discuss food.", "options": ["Ask what would make today’s conversation worthwhile to them.", "Explain why nutrition should be addressed first.", "Ask the dietitian to clarify the referral.", "Offer a standard food diary."], "answer": 0, "why": "The referral does not override the client’s agenda; the other options shift authority away from the client."}, {"id": "practice-0-1", "mode": "practice", "domain": 0, "stem": "A client says your summary overlooked the importance of caring for an elder parent.", "options": ["Repeat the original summary more slowly.", "Acknowledge the omission and invite them to correct your understanding.", "Move on to the agreed exercise goal.", "Assure them you understand caregiver stress."], "answer": 1, "why": "Repairing a mismatch requires curiosity, not defensiveness, assumptions or agenda enforcement."}, {"id": "practice-0-2", "mode": "practice", "domain": 0, "stem": "A client becomes quiet after a reflective question.", "options": ["Fill the silence with suggestions.", "Ask three additional questions.", "Allow silence and remain attentively present.", "Conclude they are disengaged."], "answer": 2, "why": "Silence can be productive; rushing to fill it can displace the client’s thinking."}, {"id": "practice-0-3", "mode": "practice", "domain": 0, "stem": "A client says they value family meals, but your example assumes everyone eats at the same time.", "options": ["Explain the benefits of a regular dinner time.", "Avoid discussing family routines again.", "Recommend a standard family schedule.", "Ask what shared meals mean in their household and adapt accordingly."], "answer": 3, "why": "Cultural humility requires understanding the client’s context rather than imposing assumptions."}, {"id": "practice-0-4", "mode": "practice", "domain": 0, "stem": "Halfway through a session the client says a new issue matters more than the original plan.", "options": ["Renegotiate the agenda and available time together.", "Finish the old agenda before changing subjects.", "Tell them new topics belong in the next appointment.", "Choose whichever topic seems most clinically important."], "answer": 0, "why": "Collaborative agenda-setting remains active throughout a session."}, {"id": "practice-0-5", "mode": "practice", "domain": 0, "stem": "A client describes one success and four setbacks with a discouraged tone.", "options": ["Praise the success and ignore the setbacks.", "Explore what supported the success and what the setbacks taught them.", "Tell them they must increase effort.", "Replace their goals with easier ones."], "answer": 1, "why": "A strengths-based response can recognize both success and learning without minimizing difficulties."}, {"id": "practice-0-6", "mode": "practice", "domain": 0, "stem": "You notice you are impatient with a client whose priorities differ from yours.", "options": ["Persuade them to adopt your priorities.", "Tell them they are resisting coaching.", "Recognize your reaction and return attention to the client’s values.", "Use your own story to demonstrate what works."], "answer": 2, "why": "Coach self-management protects presence and autonomy; persuasion and self-focused disclosure do not."}, {"id": "practice-0-7", "mode": "practice", "domain": 0, "stem": "A client asks, “What would you do if you were me?” early in the relationship.", "options": ["Tell them your preferred solution.", "Refuse to discuss decisions at all.", "Provide a detailed account of your own habits.", "Explore what decision they face and what matters to them."], "answer": 3, "why": "Exploring values keeps ownership with the client without being dismissive."}, {"id": "practice-0-8", "mode": "practice", "domain": 0, "stem": "The final session approaches and a client fears losing accountability.", "options": ["Review learned skills and co-design a sustainable support plan.", "Urge them to purchase more sessions.", "Promise unlimited follow-up.", "Tell them independence should feel easy."], "answer": 0, "why": "Good closure supports self-efficacy and appropriate continuing resources."}, {"id": "practice-0-9", "mode": "practice", "domain": 0, "stem": "A client repeatedly calls themselves “lazy” when discussing routines.", "options": ["Agree that discipline is the core problem.", "Explore what they are experiencing without accepting the label as fact.", "Immediately reframe the label as false.", "Ask them to stop using negative words."], "answer": 1, "why": "Curiosity and nonjudgment are preferable to endorsing or dismissing the client’s experience."}, {"id": "practice-1-0", "mode": "practice", "domain": 1, "stem": "A client says, “I know smoking is harmful, but I like the breaks it gives me.”", "options": ["List additional smoking risks.", "Reflect both the health concern and the value of the breaks.", "Tell them to replace every break with walking.", "Ask for a quit date immediately."], "answer": 1, "why": "Double-sided reflection honors ambivalence and may evoke self-directed change talk."}, {"id": "practice-1-1", "mode": "practice", "domain": 1, "stem": "A client says they are not considering changing their sleep schedule.", "options": ["Assign a bedtime log.", "Persuade them with sleep statistics.", "Explore their perspective and what, if anything, concerns them.", "Set a sleep goal for next week."], "answer": 2, "why": "When readiness is low, engagement and exploration are more appropriate than premature planning."}, {"id": "practice-1-2", "mode": "practice", "domain": 1, "stem": "A client has purchased shoes and arranged a walking partner for next Monday.", "options": ["Explain why they should start today instead.", "Return to whether exercise matters.", "Treat them as already in maintenance.", "Explore what will help them follow through on their plan."], "answer": 3, "why": "Preparation involves near-term intention and practical steps; support planning without over-directing."}, {"id": "practice-1-3", "mode": "practice", "domain": 1, "stem": "A client has maintained a new routine for months but missed several days during travel.", "options": ["Explore how they can resume and what they learned.", "Tell them the habit has failed.", "Move them back to precontemplation automatically.", "Increase their daily target to compensate."], "answer": 0, "why": "Lapses are learning opportunities, not proof that earlier progress disappeared."}, {"id": "practice-1-4", "mode": "practice", "domain": 1, "stem": "A client rates confidence in meal planning at 3/10.", "options": ["Ask why it is not a 10.", "Ask why it is a 3 rather than a 1.", "Insist they commit anyway.", "Tell them the goal is unrealistic."], "answer": 1, "why": "A lower-number comparison draws out existing capability and supports self-efficacy."}, {"id": "practice-1-5", "mode": "practice", "domain": 1, "stem": "A client says, “I could take the stairs at work.”", "options": ["Immediately write a stair-climbing schedule.", "Warn them stairs are insufficient exercise.", "Ask what appeals to them about that possibility.", "Tell them to buy a fitness tracker."], "answer": 2, "why": "The statement expresses ability/change talk; evoke more before rushing to planning."}, {"id": "practice-1-6", "mode": "practice", "domain": 1, "stem": "A client feels pressured by family to change eating habits.", "options": ["Use the family pressure as leverage.", "Ask family members to monitor their meals.", "Set the family’s target as the coaching goal.", "Explore what changes they personally would choose, if any."], "answer": 3, "why": "Autonomy is central to self-determination; external pressure can undermine ownership."}, {"id": "practice-1-7", "mode": "practice", "domain": 1, "stem": "A client says, “I always quit after two weeks.”", "options": ["Explore occasions they persisted and what supported them.", "Tell them to be more positive.", "Warn that quitting is self-sabotage.", "Recommend a 30-day challenge."], "answer": 0, "why": "Mastery experiences and strengths exploration can increase perceived capability."}, {"id": "practice-1-8", "mode": "practice", "domain": 1, "stem": "A client wants to make movement automatic.", "options": ["Rely on inspiration each morning.", "Connect a small action to a reliable existing daily cue.", "Change the routine time daily.", "Begin with the most demanding exercise possible."], "answer": 1, "why": "Stable cues and manageable repetition support habit formation."}, {"id": "practice-1-9", "mode": "practice", "domain": 1, "stem": "A client has mixed feelings about reducing alcohol use and begins defending the current pattern.", "options": ["Debate the medical evidence until they agree.", "Label the response as resistance.", "Reflect their reasons for staying the same without arguing.", "Demand a firm commitment."], "answer": 2, "why": "Responding nonjudgmentally to sustain talk reduces discord and preserves partnership."}, {"id": "practice-2-0", "mode": "practice", "domain": 2, "stem": "A client says, “I missed my plan again,” sounding ashamed.", "options": ["Ask why they lack discipline.", "Immediately revise the schedule for them.", "Reflect the disappointment and invite exploration of what got in the way.", "Ignore the emotion and ask for metrics."], "answer": 2, "why": "Emotion-sensitive reflection comes before troubleshooting."}, {"id": "practice-2-1", "mode": "practice", "domain": 2, "stem": "A client asks for the recommended amount of weekly physical activity.", "options": ["Prescribe an individualized training program.", "Refuse to provide any general information.", "Send a long lecture on physiology.", "Ask permission, share general guidance briefly, then ask what they think."], "answer": 3, "why": "Ask–offer–ask allows general education while protecting autonomy and scope."}, {"id": "practice-2-2", "mode": "practice", "domain": 2, "stem": "A client wants to “be healthier” by next month.", "options": ["Ask which specific action would show progress and when they could do it.", "Accept the goal as fully measurable.", "Set a weight-loss target for them.", "Tell them to choose a more ambitious goal."], "answer": 0, "why": "Behavioral specificity makes a goal actionable without imposing an outcome."}, {"id": "practice-2-3", "mode": "practice", "domain": 2, "stem": "A client’s action plan failed because a shift change altered their schedule.", "options": ["Emphasize that commitments must never change.", "Collaboratively redesign the plan around the new schedule.", "Assign an earlier wake-up time.", "Conclude that motivation is low."], "answer": 1, "why": "A flexible plan should respond to real environmental constraints."}, {"id": "practice-2-4", "mode": "practice", "domain": 2, "stem": "A client says tracking food triggers self-criticism.", "options": ["Require tracking because it is evidence-based.", "Stop discussing nutrition permanently.", "Explore other forms of feedback that feel supportive.", "Ask them to track more precisely."], "answer": 2, "why": "Accountability tools must fit the client and should not create unnecessary harm."}, {"id": "practice-2-5", "mode": "practice", "domain": 2, "stem": "A client says, “I only managed one short walk.”", "options": ["Point out they missed the other walks.", "Tell them one walk does not count.", "Increase the weekly goal.", "Ask what made that walk possible."], "answer": 3, "why": "Affirming and exploring success surfaces resources for repetition."}, {"id": "practice-2-6", "mode": "practice", "domain": 2, "stem": "A client has identified five possible changes and feels overwhelmed.", "options": ["Ask which single change feels most meaningful and doable now.", "Rank all five changes for them.", "Tell them to work on all five.", "Recommend the easiest one without discussion."], "answer": 0, "why": "Prioritization is collaborative and respects capacity."}, {"id": "practice-2-7", "mode": "practice", "domain": 2, "stem": "A client says, “I know exercise matters,” then looks away and sighs.", "options": ["Ignore nonverbal cues.", "Offer a tentative reflection about the tension you notice.", "Ask only closed questions.", "Assume the client is lying."], "answer": 1, "why": "Tentative complex reflections can surface meaning without overclaiming."}, {"id": "practice-2-8", "mode": "practice", "domain": 2, "stem": "A client asks you to email them a reminder every day.", "options": ["Promise immediate replies at all hours.", "Refuse all between-session contact.", "Explore the type and frequency of accountability they find useful and agree on boundaries.", "Set daily reminders without discussion."], "answer": 2, "why": "Accountability should be mutually agreed, feasible and within professional boundaries."}, {"id": "practice-2-9", "mode": "practice", "domain": 2, "stem": "A client cannot access an online tracking portal.", "options": ["Require the portal as a condition of coaching.", "Assume they are unwilling to participate.", "Ask them to share passwords.", "Explore accessible alternatives and confirm what works for them."], "answer": 3, "why": "Accessible communication supports equitable coaching and privacy."}, {"id": "practice-3-0", "mode": "practice", "domain": 3, "stem": "A client asks whether to reduce a prescribed medication after feeling better.", "options": ["Recommend halving the dose.", "Advise stopping it temporarily.", "Suggest replacing it with supplements.", "Refer the medication decision to the prescribing clinician and support question preparation."], "answer": 3, "why": "Medication decisions are clinical, not independent coaching decisions."}, {"id": "practice-3-1", "mode": "practice", "domain": 3, "stem": "A client discloses an immediate plan to harm themselves.", "options": ["Follow emergency/safety procedures to connect them with urgent help.", "Explore a long-term wellness vision first.", "Schedule a routine follow-up.", "Use a motivation scale."], "answer": 0, "why": "Immediate safety takes precedence over ordinary coaching."}, {"id": "practice-3-2", "mode": "practice", "domain": 3, "stem": "A client wants a disease-specific meal plan for kidney disease.", "options": ["Write a high-protein plan.", "Refer for individualized medical nutrition therapy while supporting behavior goals.", "Copy a meal plan from social media.", "Prescribe a strict elimination diet."], "answer": 1, "why": "Therapeutic diets require qualified clinical care."}, {"id": "practice-3-3", "mode": "practice", "domain": 3, "stem": "You receive compensation for recommending a wellness product.", "options": ["Mention it only if the client asks.", "Claim the product is essential.", "Disclose the financial relationship and manage the conflict appropriately.", "Hide the relationship to avoid confusion."], "answer": 2, "why": "Conflicts of interest must be disclosed and not distort professional judgment."}, {"id": "practice-3-4", "mode": "practice", "domain": 3, "stem": "A client asks you to upload identifiable coaching notes into a public AI chatbot.", "options": ["Remove only the client’s first name.", "Assume deletion makes it private.", "Upload it if it improves productivity.", "Avoid submitting client data to the tool and follow applicable privacy rules."], "answer": 3, "why": "Client information must be protected; removing a name alone may not de-identify records."}, {"id": "practice-3-5", "mode": "practice", "domain": 3, "stem": "A new client asks whether sessions are confidential.", "options": ["Explain confidentiality, its limits, and relevant agreements before proceeding.", "Promise absolute secrecy under all circumstances.", "Say privacy is unnecessary in coaching.", "Defer discussion until a problem arises."], "answer": 0, "why": "Informed agreements must address privacy and relevant limits."}, {"id": "practice-3-6", "mode": "practice", "domain": 3, "stem": "A client asks to work through traumatic memories using exposure exercises.", "options": ["Provide exposure therapy as coaching.", "Explain the coaching scope and discuss referral to a qualified mental health clinician.", "Interpret the client’s trauma response.", "Promise coaching can replace psychotherapy."], "answer": 1, "why": "Psychotherapy and trauma treatment require appropriate qualifications and role clarity."}, {"id": "practice-3-7", "mode": "practice", "domain": 3, "stem": "A coach with a clinical license is seeing someone for health coaching.", "options": ["Switch between clinical and coaching roles without discussion.", "Assume credentials eliminate scope limits.", "Clearly identify which role is being provided and the boundaries of that service.", "Avoid written agreements."], "answer": 2, "why": "Multiple credentials do not replace clear informed consent and role definition."}, {"id": "practice-3-8", "mode": "practice", "domain": 3, "stem": "A client asks to include a partner in a session.", "options": ["Invite the partner automatically.", "Share previous notes first.", "Refuse any support-person involvement.", "Discuss consent, confidentiality and the purpose before inviting anyone."], "answer": 3, "why": "Third-party participation requires thoughtful agreements and privacy safeguards."}, {"id": "practice-3-9", "mode": "practice", "domain": 3, "stem": "You notice fatigue is impairing your ability to listen attentively.", "options": ["Address your capacity, seek appropriate support and adjust practice as needed.", "Ignore it because clients cannot tell.", "Ask clients to provide emotional support.", "Increase your workload to become resilient."], "answer": 0, "why": "Professional self-awareness and self-care protect client welfare."}, {"id": "practice-4-0", "mode": "practice", "domain": 4, "stem": "A client with chest pressure, sweating and shortness of breath asks whether to continue coaching.", "options": ["Treat the symptoms as potentially urgent and activate emergency help.", "Recommend hydration and a short rest.", "Suggest a brisk walk.", "Continue the session and reassess later."], "answer": 0, "why": "Possible cardiac emergency signs warrant immediate action."}, {"id": "practice-4-1", "mode": "practice", "domain": 4, "stem": "A client with diabetes asks what their specific A1c means for medication changes.", "options": ["Calculate a new medication dose.", "Refer interpretation and medication decisions to their healthcare professional.", "Recommend stopping carbohydrates entirely.", "Tell them to discontinue medication if they feel well."], "answer": 1, "why": "Coaches can support health literacy but not independently direct treatment."}, {"id": "practice-4-2", "mode": "practice", "domain": 4, "stem": "A client lives where walking outdoors feels unsafe.", "options": ["Tell them safety concerns are excuses.", "Require an expensive gym.", "Explore safe and accessible movement options within their circumstances.", "Insist outdoor walking is the only effective option."], "answer": 2, "why": "Social and environmental conditions shape realistic health choices."}, {"id": "practice-4-3", "mode": "practice", "domain": 4, "stem": "A client says they sleep five hours and feel tired.", "options": ["Diagnose insomnia.", "Prescribe a sleep medication.", "Promise that a fixed bedtime will cure fatigue.", "Explore routines and discuss general sleep guidance, referring if symptoms warrant."], "answer": 3, "why": "General sleep education fits coaching; diagnosis and treatment do not."}, {"id": "practice-4-4", "mode": "practice", "domain": 4, "stem": "A client reports loud snoring, witnessed breathing pauses and daytime sleepiness.", "options": ["Encourage timely evaluation by an appropriate healthcare professional.", "Diagnose sleep apnea yourself.", "Recommend a supplement as treatment.", "Tell them snoring is always harmless."], "answer": 0, "why": "These symptoms may indicate sleep-disordered breathing and warrant assessment."}, {"id": "practice-4-5", "mode": "practice", "domain": 4, "stem": "A client asks whether BMI precisely measures their body-fat percentage.", "options": ["Say BMI directly measures muscle mass.", "Explain that BMI is a screening measure, not a direct body-composition measurement.", "Say BMI diagnoses metabolic disease.", "Say BMI is always meaningless."], "answer": 1, "why": "BMI has limitations and should not be mistaken for direct body-composition assessment."}, {"id": "practice-4-6", "mode": "practice", "domain": 4, "stem": "A client wants to improve blood pressure through everyday eating habits.", "options": ["Prescribe a medication.", "Guarantee dietary change will replace clinical care.", "Share general evidence about DASH with permission and invite their preferences.", "Provide a rigid disease-specific meal prescription."], "answer": 2, "why": "General evidence-based education is appropriate; individualized treatment remains clinical."}, {"id": "practice-4-7", "mode": "practice", "domain": 4, "stem": "A client asks how much aerobic activity adults generally need.", "options": ["Require 150 minutes immediately regardless of health status.", "State that only vigorous exercise counts.", "Claim activity has no benefit below 150 minutes.", "Share the broad guideline of at least 150 minutes of moderate activity weekly, with context."], "answer": 3, "why": "Guidelines are general; any movement can help and individual medical considerations matter."}, {"id": "practice-4-8", "mode": "practice", "domain": 4, "stem": "A client says they cannot afford fresh produce every week.", "options": ["Explore affordable, culturally relevant food options and local resources.", "Tell them to buy only organic produce.", "Assume they lack commitment.", "Prescribe an expensive meal delivery plan."], "answer": 0, "why": "Food affordability is a meaningful social determinant of health."}, {"id": "practice-4-9", "mode": "practice", "domain": 4, "stem": "A client suddenly develops one-sided weakness and slurred speech.", "options": ["Recommend rest until tomorrow.", "Call emergency services immediately for possible stroke.", "Offer breathing exercises.", "Ask them to finish the coaching worksheet."], "answer": 1, "why": "Possible stroke symptoms require immediate emergency response."}, {"id": "mock-0-0", "mode": "mock", "domain": 0, "stem": "A client says “I want accountability,” but later describes your reminders as controlling.", "options": ["Explain that accountability necessarily includes pressure.", "Stop all follow-up without discussing it.", "Ask what accountability would feel supportive and renegotiate the agreement.", "Ask their spouse to enforce the plan."], "answer": 2, "why": "A coaching agreement is revisable; consent and client experience matter."}, {"id": "mock-0-1", "mode": "mock", "domain": 0, "stem": "A client from a different cultural background pauses when you ask about personal goals.", "options": ["Assume the client is uncomfortable with change.", "Repeat the question more forcefully.", "Avoid mentioning culture because it may offend.", "Explore whether individual goal-setting fits their values and relationships."], "answer": 3, "why": "Cultural responsiveness requires exploring, not assuming, how values shape decisions."}, {"id": "mock-0-2", "mode": "mock", "domain": 0, "stem": "A client describes an impressive achievement but says it feels insignificant.", "options": ["Ask what the accomplishment says about their strengths and values.", "Insist that they should feel proud.", "Move on because the goal was achieved.", "Tell them to set a harder target."], "answer": 0, "why": "Evocative exploration supports authentic meaning without prescribing feelings."}, {"id": "mock-0-3", "mode": "mock", "domain": 0, "stem": "During a session you realize your personal preference for vegetarian eating is shaping your questions.", "options": ["Explain why vegetarianism is the superior choice.", "Notice the bias and return to the client’s chosen health priorities.", "Avoid discussing food ever again.", "Tell the client your beliefs so they can agree."], "answer": 1, "why": "Coach awareness and nonattachment reduce subtle agenda-setting."}, {"id": "mock-0-4", "mode": "mock", "domain": 0, "stem": "A client asks you to keep a serious disclosure secret from everyone, before explaining it.", "options": ["Promise secrecy to maintain rapport.", "Ask for the details before mentioning limits.", "Explain confidentiality and its limits before inviting disclosure.", "Tell the client never to disclose sensitive matters."], "answer": 2, "why": "Transparent confidentiality boundaries should precede sensitive disclosures."}, {"id": "mock-0-5", "mode": "mock", "domain": 0, "stem": "A client asks you to choose their goal because they feel indecisive.", "options": ["Select the goal most likely to improve their lab results.", "End the session until they decide alone.", "Ask their doctor to choose all coaching goals.", "Offer a structured exploration of options and invite them to choose."], "answer": 3, "why": "Structure can support decision-making without replacing client autonomy."}, {"id": "mock-0-6", "mode": "mock", "domain": 0, "stem": "A client wants to celebrate a milestone by discussing what their family noticed.", "options": ["Explore the meaning of the feedback and the client’s own view of progress.", "Treat family praise as the only valid outcome.", "Move immediately to the next target.", "Ask for a testimonial for your website."], "answer": 0, "why": "Client-defined meaning and strengths matter more than external validation."}, {"id": "mock-0-7", "mode": "mock", "domain": 0, "stem": "A client arrives late and apologizes repeatedly because of transportation problems.", "options": ["Deduct points from their accountability score.", "Acknowledge the barrier and collaboratively decide how to use remaining time.", "Assume low commitment.", "Extend the session without considering boundaries."], "answer": 1, "why": "Partnership respects circumstances while maintaining clear agreements."}, {"id": "mock-0-8", "mode": "mock", "domain": 0, "stem": "A client becomes tearful and says they are not ready to discuss the topic further.", "options": ["Insist that emotional disclosure is necessary.", "Interpret the tears as unresolved trauma.", "Honor their choice and ask what would feel helpful now.", "Continue questioning until they explain."], "answer": 2, "why": "Emotional safety and client autonomy take precedence over completing an agenda."}, {"id": "mock-0-9", "mode": "mock", "domain": 0, "stem": "Near termination, a client says they have relied on you to make decisions.", "options": ["Offer to make decisions between sessions indefinitely.", "Tell them dependency is a personal failure.", "End immediately without planning.", "Explore how they can practice independent decision-making and support options."], "answer": 3, "why": "Thoughtful closure builds self-management rather than dependence."}, {"id": "mock-1-0", "mode": "mock", "domain": 1, "stem": "A client says, “I should exercise, but my evenings are for my children.”", "options": ["Tell them health must come before family.", "Recommend a gym membership.", "Label the statement as an excuse.", "Reflect the competing values and invite a client-generated possibility."], "answer": 3, "why": "Ambivalence may reflect genuine competing values, not lack of knowledge."}, {"id": "mock-1-1", "mode": "mock", "domain": 1, "stem": "A client says, “Maybe I could walk on weekends,” then asks if that is enough.", "options": ["Explore what makes weekends feasible before offering general information with permission.", "Dismiss weekend walking as inadequate.", "Set a seven-day schedule.", "Ignore their emerging idea."], "answer": 0, "why": "Evoking their plan before information preserves ownership."}, {"id": "mock-1-2", "mode": "mock", "domain": 1, "stem": "A client scores importance at 9/10 but confidence at 2/10.", "options": ["Spend the session persuading them the goal matters.", "Explore a smaller achievable step and existing supports.", "Demand a high-confidence commitment.", "Conclude they are unwilling."], "answer": 1, "why": "Importance is already high; confidence and feasibility need attention."}, {"id": "mock-1-3", "mode": "mock", "domain": 1, "stem": "A client reports following a plan for six months and fears a future lapse.", "options": ["Tell them lapses never happen in maintenance.", "Increase restrictions to prevent any lapse.", "Explore coping plans, support and how they have sustained success.", "Suggest they stop reflecting on progress."], "answer": 2, "why": "Maintenance includes relapse prevention and flexible recovery strategies."}, {"id": "mock-1-4", "mode": "mock", "domain": 1, "stem": "A client says, “My partner thinks I need to lose weight; I’m not sure I agree.”", "options": ["Make the partner’s goal the priority.", "Use weight charts to persuade them.", "Ask the partner to attend every session.", "Explore their own perspective and whether they want to pursue any change."], "answer": 3, "why": "The client’s autonomy is more important than others’ preferred outcomes."}, {"id": "mock-1-5", "mode": "mock", "domain": 1, "stem": "A client responds to repeated advice by defending their current habits more strongly.", "options": ["Stop persuading and use reflections to understand their perspective.", "Present more forceful evidence.", "Confront the inconsistency.", "Treat disagreement as noncompliance."], "answer": 0, "why": "Arguing can intensify sustain talk and discord."}, {"id": "mock-1-6", "mode": "mock", "domain": 1, "stem": "A client recalls successfully learning a new language through short daily practice.", "options": ["Assume language learning is unrelated.", "Explore how that learning strategy might support a health behavior.", "Assign the same daily practice time.", "Tell them willpower is their greatest strength."], "answer": 1, "why": "Transferring client-generated mastery strategies builds self-efficacy."}, {"id": "mock-1-7", "mode": "mock", "domain": 1, "stem": "A client has a strong personal reason to change but is uncertain about the first step.", "options": ["Keep evoking reasons indefinitely.", "Assign a comprehensive plan.", "Ask what small action they would be willing to try and how it fits their life.", "Tell them readiness must be perfect first."], "answer": 2, "why": "When motivation is present, collaborative planning can be timely."}, {"id": "mock-1-8", "mode": "mock", "domain": 1, "stem": "A client says, “I might be able to pack lunch twice this week.”", "options": ["Tell them twice is insufficient.", "Turn the idea into a mandatory daily goal.", "Provide a calorie target immediately.", "Reflect the possibility and ask what would make it workable."], "answer": 3, "why": "Ability language can be strengthened through client-led elaboration."}, {"id": "mock-1-9", "mode": "mock", "domain": 1, "stem": "A client changes a goal after discovering it conflicts with a cherished tradition.", "options": ["Explore a revised goal consistent with their values.", "Insist on the original target.", "Explain that tradition should not influence health.", "Mark the client as resistant."], "answer": 0, "why": "Value-congruent goals are more autonomous and sustainable."}, {"id": "mock-2-0", "mode": "mock", "domain": 2, "stem": "A client says, “I failed because I skipped Wednesday,” despite completing three other sessions.", "options": ["Offer a reflection that recognizes both disappointment and completed actions.", "Tell them the feeling is irrational.", "Ignore the missed day.", "Ask them to double their workouts."], "answer": 0, "why": "Balanced reflection avoids minimizing or reinforcing all-or-nothing conclusions."}, {"id": "mock-2-1", "mode": "mock", "domain": 2, "stem": "A client asks you to make their goal SMART but says schedules are unpredictable.", "options": ["Require an exact daily clock time.", "Collaboratively define a flexible, observable action with a realistic time window.", "Abandon all goal-setting.", "Set a goal based on outcomes they cannot control."], "answer": 1, "why": "SMART planning can be specific without being rigid."}, {"id": "mock-2-2", "mode": "mock", "domain": 2, "stem": "A client is overwhelmed by data from three health apps.", "options": ["Recommend adding another app.", "Insist they track all available metrics.", "Ask which information actually helps them decide what to do next.", "Interpret the data as a diagnosis."], "answer": 2, "why": "Useful feedback is selective and meaningful to the client."}, {"id": "mock-2-3", "mode": "mock", "domain": 2, "stem": "A client says, “I know I need more sleep,” but has not asked for advice.", "options": ["Deliver sleep hygiene instructions immediately.", "Prescribe a sleep aid.", "Tell them to stop screen use entirely.", "Reflect what they hope better sleep would change."], "answer": 3, "why": "Evocation is often more appropriate than unsolicited education."}, {"id": "mock-2-4", "mode": "mock", "domain": 2, "stem": "A client requests a specific fact you know from a credible public-health guideline.", "options": ["Ask permission to share the fact, give it briefly and invite their reaction.", "Refuse all information because coaching is only questions.", "Use the fact to pressure them.", "Share a lengthy technical article without context."], "answer": 0, "why": "Appropriate education is concise, evidence-based and collaborative."}, {"id": "mock-2-5", "mode": "mock", "domain": 2, "stem": "A client wants accountability but finds numerical goals demoralizing.", "options": ["Require daily numeric tracking.", "Explore qualitative or behavioral check-ins they would prefer.", "Remove accountability entirely.", "Tell them measurable goals are impossible."], "answer": 1, "why": "Accountability can be customized without relying solely on numbers."}, {"id": "mock-2-6", "mode": "mock", "domain": 2, "stem": "A client’s goal depends on a gym that has unexpectedly closed.", "options": ["Declare the goal invalid.", "Tell them to travel farther without discussion.", "Invite alternative routes to the same client-defined purpose.", "Increase their commitment score."], "answer": 2, "why": "Adaptive problem-solving preserves the goal’s meaning while changing tactics."}, {"id": "mock-2-7", "mode": "mock", "domain": 2, "stem": "A client has not followed through and says, “I didn’t really choose this goal.”", "options": ["Offer stricter reminders.", "Increase incentives.", "Explain why the goal is medically necessary.", "Revisit the goal’s ownership and relevance before adjusting tactics."], "answer": 3, "why": "Lack of ownership calls for renewed agreement, not stronger pressure."}, {"id": "mock-2-8", "mode": "mock", "domain": 2, "stem": "A client describes a successful week but you have only two minutes remaining.", "options": ["Ask what they most want to remember and identify a concise next step.", "Open an unrelated new topic.", "Skip closure without explanation.", "Assign homework without consent."], "answer": 0, "why": "A short client-centered summary and next step create useful closure."}, {"id": "mock-2-9", "mode": "mock", "domain": 2, "stem": "A client says they prefer speaking to writing when reflecting on progress.", "options": ["Require a journal.", "Offer a spoken check-in method consistent with privacy and agreements.", "Conclude they cannot self-monitor.", "Record all conversations without consent."], "answer": 1, "why": "Accessibility and preferences should guide coaching tools."}, {"id": "mock-3-0", "mode": "mock", "domain": 3, "stem": "A client asks you to read a specialist’s report and tell them whether surgery is needed.", "options": ["Recommend surgery based on the report.", "Encourage discussion with the treating clinician and help prepare questions.", "Advise avoiding surgery categorically.", "Interpret the report as a diagnosis."], "answer": 1, "why": "Decisions about surgery require qualified clinical evaluation."}, {"id": "mock-3-1", "mode": "mock", "domain": 3, "stem": "A client shares another person’s confidential medical details during a group coaching session.", "options": ["Invite more details for group learning.", "Record the disclosure in a public document.", "Redirect respectfully and reinforce privacy expectations.", "Assume third-party privacy does not matter."], "answer": 2, "why": "Privacy safeguards apply to group interactions and third-party information."}, {"id": "mock-3-2", "mode": "mock", "domain": 3, "stem": "A client offers you a valuable gift that may affect professional boundaries.", "options": ["Always accept to preserve rapport.", "Always reject without discussion.", "Ask for a more valuable gift.", "Consider the ethics, cultural context, value and relevant policies before accepting."], "answer": 3, "why": "Boundary decisions require thoughtful assessment rather than automatic rules."}, {"id": "mock-3-3", "mode": "mock", "domain": 3, "stem": "A client asks whether you can guarantee that coaching will reverse their condition.", "options": ["Explain realistic coaching scope and avoid promising medical outcomes.", "Guarantee reversal if they follow the plan.", "Use testimonials as proof.", "Tell them their diagnosis is inaccurate."], "answer": 0, "why": "Coaching supports behavior change but cannot guarantee clinical outcomes."}, {"id": "mock-3-4", "mode": "mock", "domain": 3, "stem": "You discover a scheduling platform may expose client contact details.", "options": ["Continue until a breach is confirmed.", "Stop unsafe use and follow applicable privacy/security procedures.", "Share screenshots publicly for troubleshooting.", "Assume the vendor is responsible for everything."], "answer": 1, "why": "Proactive protection and appropriate response are professional duties."}, {"id": "mock-3-5", "mode": "mock", "domain": 3, "stem": "A client asks for psychotherapy during a coaching session because you are also a therapist.", "options": ["Switch roles silently.", "Treat coaching consent as consent for therapy.", "Clarify the current service and discuss a separate appropriate clinical arrangement or referral.", "Provide therapy without records."], "answer": 2, "why": "Distinct roles require explicit informed agreements and proper clinical procedures."}, {"id": "mock-3-6", "mode": "mock", "domain": 3, "stem": "A client discloses a symptom that may need urgent assessment but asks you to keep coaching.", "options": ["Continue because the client controls all topics.", "Offer an herbal remedy.", "Wait for the next session.", "Prioritize safety and appropriate urgent referral over routine coaching."], "answer": 3, "why": "Client autonomy does not remove emergency and safety responsibilities."}, {"id": "mock-3-7", "mode": "mock", "domain": 3, "stem": "A client asks for a supplement recommendation and you lack reliable evidence.", "options": ["Be transparent about your limits and suggest qualified professional advice.", "Invent a confident recommendation.", "Use an influencer endorsement.", "Recommend the highest-rated product."], "answer": 0, "why": "Evidence-based practice includes recognizing uncertainty and scope."}, {"id": "mock-3-8", "mode": "mock", "domain": 3, "stem": "A colleague requests your client’s progress notes informally.", "options": ["Send the notes because they are a colleague.", "Confirm authorization and applicable privacy rules before sharing anything.", "Share only by personal text message.", "Assume professional interest creates consent."], "answer": 1, "why": "Professional relationships do not automatically authorize disclosure."}, {"id": "mock-3-9", "mode": "mock", "domain": 3, "stem": "You want to use a client success story in marketing.", "options": ["Use the story without a name.", "Assume positive stories are exempt from consent.", "Obtain appropriate informed permission and consider confidentiality and power dynamics.", "Post the story first and ask later."], "answer": 2, "why": "Even apparently anonymous stories can be identifiable; consent and ethical judgment matter."}, {"id": "mock-4-0", "mode": "mock", "domain": 4, "stem": "A client says they will start vigorous exercise despite chest symptoms with exertion.", "options": ["Create a vigorous interval plan.", "Reassure them symptoms are normal.", "Encourage prompt medical evaluation before exertional escalation.", "Tell them to push through discomfort."], "answer": 2, "why": "Potential cardiac warning signs require clinical assessment."}, {"id": "mock-4-1", "mode": "mock", "domain": 4, "stem": "A client asks whether eating less sodium can help with blood pressure.", "options": ["Promise a cure through diet alone.", "Prescribe a strict sodium limit without assessment.", "Tell them dietary changes never matter.", "Offer general evidence-based guidance with permission and encourage individualized medical advice."], "answer": 3, "why": "General information is appropriate; individual treatment decisions need clinical input."}, {"id": "mock-4-2", "mode": "mock", "domain": 4, "stem": "A client works nights and cannot follow standard daytime sleep tips.", "options": ["Explore sleep-supportive routines suited to shift work and consider referral as needed.", "Require a 10 PM bedtime.", "Conclude they cannot improve sleep.", "Prescribe melatonin dosing."], "answer": 0, "why": "Context-sensitive coaching adapts to real schedules and stays within scope."}, {"id": "mock-4-3", "mode": "mock", "domain": 4, "stem": "A client asks if strength training matters when they already walk regularly.", "options": ["Say walking always replaces strength training.", "Share general recommendations for muscle-strengthening activity and explore preferences.", "Prescribe heavy lifting immediately.", "Recommend training through pain."], "answer": 1, "why": "General guidance includes aerobic and muscle-strengthening activities."}, {"id": "mock-4-4", "mode": "mock", "domain": 4, "stem": "A client says food advice conflicts with their religious dietary practices.", "options": ["Tell them to disregard their practices.", "Provide a one-size-fits-all diet.", "Explore culturally and religiously compatible options and appropriate referrals.", "Avoid discussing nutrition entirely."], "answer": 2, "why": "Respectful health coaching adapts to client values and context."}, {"id": "mock-4-5", "mode": "mock", "domain": 4, "stem": "A client describes persistent sadness and loss of interest affecting daily functioning.", "options": ["Diagnose major depression.", "Provide psychotherapy techniques as coaching.", "Ignore the symptoms and focus on steps.", "Acknowledge their experience and encourage qualified mental health evaluation."], "answer": 3, "why": "Possible mental health conditions warrant appropriate assessment and support."}, {"id": "mock-4-6", "mode": "mock", "domain": 4, "stem": "A client asks if an A1c of 5.9% automatically means they need medication.", "options": ["Explain that treatment decisions require a clinician and support informed questions.", "Prescribe medication based on the number.", "Promise that exercise alone is sufficient.", "Tell them the result proves diabetes."], "answer": 0, "why": "A single screening result does not justify independent medication advice."}, {"id": "mock-4-7", "mode": "mock", "domain": 4, "stem": "A client has limited access to transportation for preventive care.", "options": ["Tell them to try harder.", "Explore telehealth, local services and practical access resources.", "Assume preventive care is unimportant.", "Schedule care without permission."], "answer": 1, "why": "Transportation is a social determinant and practical barrier worth addressing."}, {"id": "mock-4-8", "mode": "mock", "domain": 4, "stem": "A client says exercise only counts if it makes them sweat heavily.", "options": ["Agree that sweat determines effectiveness.", "Insist on high-intensity intervals.", "With permission, explain that moderate movement can be beneficial and explore enjoyable options.", "Tell them to avoid all vigorous activity."], "answer": 2, "why": "Exercise benefit is not measured by sweating alone."}, {"id": "mock-4-9", "mode": "mock", "domain": 4, "stem": "A client reports sudden severe headache and confusion during a session.", "options": ["Recommend a glass of water.", "Offer relaxation exercises.", "Reschedule the session for next week.", "Seek emergency medical assistance immediately."], "answer": 3, "why": "Acute neurological symptoms may signal a medical emergency."}];
const DOMAINS=[["Coaching Presence & Partnership", 25, "How to protect client autonomy while building a trusting, culturally responsive coaching relationship."], ["Behavior Change & Motivation", 15, "How to recognize readiness, evoke change talk, and work skillfully with ambivalence."], ["Coaching Skills & Strategy", 25, "How to choose reflections, questions, goal-setting and accountability tools."], ["Ethics & Professional Judgment", 15, "How to handle boundaries, confidentiality, conflicts, referrals and technology."], ["Health & Wellness Reasoning", 20, "How to apply general health literacy while staying within the coaching role."]];
const DATA=[
{title:'Coaching Presence & Partnership',take:'A client can feel understood without agreeing with you. That is a sign of effective partnership, not a problem to solve.',lessons:[['The subtle difference: partnership versus permission','Even a respectful suggestion can become directive when the coach chooses the agenda. Notice who owns the question, the goal, and the next step. An effective coach may structure a conversation while leaving decisions with the client.'],['Repair matters more than perfection','When a client says you missed something, resist explaining your intention. Acknowledge the impact, ask for correction, and adapt. This is especially important in culturally responsive coaching.'],['Silence, emotion and uncertainty','Silence is not automatically resistance. Tears do not automatically mean a mental health referral. Stay present, acknowledge, and ask what the client wants next; escalate or refer when there is a clinical or safety need.'],['Ending well','Closing is not a sales conversation. Help the client identify capabilities, relapse-recovery strategies, and supports they can use without you.']],dialogue:['Client: “You keep asking about workouts, but I’m exhausted caring for my father.”','Coach: “I’ve been focusing on workouts and missed what’s taking so much of your energy. What feels most important to talk through today?”'],trap:'The tempting answer often sounds helpful but solves the coach’s problem rather than the client’s.',anchor:'Whose agenda? Whose meaning? Whose next step?'},
{title:'Behavior Change & Motivation',take:'A person can deeply value change and still lack the confidence, opportunity, or bandwidth to begin.',lessons:[['Importance and confidence are not interchangeable','If importance is high and confidence is low, more persuasion is usually the wrong move. Explore a smaller first step, previous successes, and resources.'],['Listen for change talk','Desire (“I want”), ability (“I could”), reasons (“I’d have more energy”), need (“I must”), commitment (“I will”), activation and taking steps are not the same. A possibility is not yet a commitment.'],['Work with ambivalence','Reflect both sides accurately. Do not argue with sustain talk: it often grows louder when the coach debates. Use engaging, focusing, evoking and planning flexibly, not as a rigid script.'],['Readiness changes','Stages of change describe a process, not a permanent client type. A lapse does not erase progress. Preparation involves intention and practical steps; maintenance involves sustaining and recovering.'],['Motivation that lasts','Autonomy, competence and relatedness support internal motivation. Small mastery experiences and stable cues can be more useful than motivational speeches.']],dialogue:['Client: “I know walking would help, but evenings belong to my kids.”','Coach: “Your health matters, and so does being there for your children. What possibilities, if any, would honor both?”'],trap:'Do not jump to SMART goals simply because the client mentions a benefit of change.',anchor:'Readiness first. Evoke before plan.'},
{title:'Coaching Skills & Strategy',take:'The strongest response is often the one that makes the client’s own thinking more useful.',lessons:[['Reflections are not disguised advice','A simple reflection repeats or paraphrases. A complex reflection tentatively adds meaning or emotion. Neither should smuggle in the coach’s preferred solution.'],['OARS is a toolkit, not a checklist','Open questions, affirmations, reflections and summaries serve different purposes. Too many questions in a row can feel like interrogation. Affirm specific effort, strategy or values, not generic praise.'],['Ask–offer–ask','When information is relevant: ask permission; offer a brief, reliable fact within scope; ask what the client makes of it. You do not have to withhold all information, and you should not lecture.'],['SMART without rigidity','A useful goal is specific, measurable, achievable, relevant and time-bound. But an unpredictable work schedule may call for a flexible time window rather than a fixed clock time. Behavioral goals are usually more controllable than outcomes.'],['Accountability without surveillance','The client should help choose what to track, how often, and why. If a tool triggers shame, change the tool—not necessarily the client’s goal.']],dialogue:['Client: “I only walked once. I’m terrible at this.”','Coach: “You’re disappointed that it happened once, and there was still a day when you found a way. What made that possible?”'],trap:'A correct-sounding technique can be wrong if it ignores emotion, timing or client choice.',anchor:'Reflect → explore → co-design.'},
{title:'Ethics & Professional Judgment',take:'Scope is not a wall that ends the conversation; it is a boundary that keeps the conversation safe.',lessons:[['Refer without abandoning','You can say “That requires your clinician” and still help the client prepare questions, identify support, and follow through with client-chosen actions.'],['Role clarity','Having an additional clinical license does not mean a coaching session automatically becomes clinical care. Explain the service being provided and obtain appropriate agreements before changing roles.'],['Privacy in the real world','Confidentiality extends to group settings, marketing stories, colleagues, shared devices and AI tools. Removing a name is not always enough to de-identify information.'],['Conflict of interest and power','Financial incentives, gifts and testimonials can affect trust. Disclose relevant conflicts and apply ethical judgment rather than treating the client as a customer to convert.'],['Emergency exceptions','A potential medical emergency or immediate risk of harm changes priorities: follow applicable emergency and safety procedures, not routine motivational interviewing.']],dialogue:['Client: “Can you tell me whether my new medication is working?”','Coach: “Your prescriber is the right person to interpret that. What would you like to ask them, and how can I help you prepare?”'],trap:'“The client chooses” is not a justification for ignoring emergencies, privacy or scope.',anchor:'Protect → clarify → refer → support.'},
{title:'Health & Wellness Reasoning',take:'Know enough science to recognize trustworthy guidance, and enough humility to know when individual advice belongs to a clinician.',lessons:[['General guidance versus individualized treatment','Broad public-health recommendations can be discussed with permission. Diagnosing, interpreting personal lab results, adjusting medications, and prescribing disease-specific diets require appropriate clinical qualifications.'],['Physical activity','General adult guidelines recommend at least 150 minutes of moderate aerobic activity per week and muscle-strengthening activities on at least two days. Some movement is better than none; individual limitations matter.'],['Sleep and recovery','Most adults need roughly 7–9 hours. Shift work, caregiving, sleep disorders and environment can complicate routines. Snoring with witnessed pauses and daytime sleepiness warrants evaluation.'],['Nutrition and cardiometabolic health','DASH is an evidence-based eating pattern for blood pressure. An A1c of 5.7–6.4% is generally the prediabetes range, but the meaning and treatment of an individual result require a clinician. BMI is a screening measure, not a direct body-fat measurement.'],['Health equity is practical','Food cost, safe spaces, transportation, disability access, work schedules and cultural practices affect what is realistic. Treat these as constraints to explore, not excuses.'],['Red flags','Sudden stroke-like symptoms, possible heart attack symptoms, severe breathing difficulty and acute neurological changes require emergency assessment.']],dialogue:['Client: “The park near me isn’t safe after work.”','Coach: “Safety matters. What other movement options might be realistic with your schedule and surroundings?”'],trap:'Do not mistake memorizing a guideline for permission to prescribe it to an individual.',anchor:'Evidence + context + scope.'}

function navigate(page,domain){state.last=page;save();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));if(page==='home')home();if(page==='chapters')chapters();if(page==='chapter')chapter(domain);if(page==='quiz')quiz(domain);if(page==='review')review();if(page==='mock')mock();if(page==='tools')tools();window.scrollTo(0,0)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));function action(label,page,domain,cls='btn'){return `<button class="${cls}" data-go="${page}" data-domain="${domain??''}">${esc(label)}</button>`}function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go,b.dataset.domain===''?undefined:+b.dataset.domain))}
function home(){const total=DOMAINS.reduce((a,_,i)=>a+answered(i),0);$('app').innerHTML=`<section class="hero"><div class="eyebrow">Made for you, Joanie</div><h1>More than another study guide.</h1><p>You've already got classes and course materials. This companion adds what helps on exam day: <strong>judgment in realistic conversations</strong>, close-call answer choices, and feedback that explains the difference.</p><p class="muted">Start with one deep dive, then try its ten scenario questions. Come back whenever you have 15 minutes.</p><div class="toolbar">${action('Start a deep dive','chapters')}${action('Try the advanced mock exam','mock',undefined,'btn secondary')}</div></section><div class="cards"><section class="card"><div class="eyebrow">Practice progress</div><div class="stat">${total}/50</div><div class="meter"><span style="width:${total*2}%"></span></div><p class="muted small">Questions checked on this device</p></section><section class="card"><div class="eyebrow">Your study rhythm</div><h3>Short and consistent</h3><p>Tuesday / Thursday: 10-minute scenario review after class. Weekend: one 10-question set. Use this only if it fits your week.</p></section><section class="card"><div class="eyebrow">Important</div><h3>Your work stays here</h3><p>Answers are saved in this browser on this device. They don't synchronize between your phone and computer.</p></section></div><h2>Choose your next step</h2><div class="cards">${DOMAINS.map((d,i)=>`<section class="card"><span class="pill">${d[1]}% exam domain</span><h3>${i+1}. ${esc(d[0])}</h3><p>${esc(d[2])}</p><p class="small muted">${answered(i)}/10 checked · ${correct(i)} correct</p>${action('Open deep dive','chapter',i,'btn secondary')}</section>`).join('')}</div>${foot()}`;wire()}
function chapters(){$('app').innerHTML=`<div class="eyebrow">Five practical deep dives</div><h1>Build better judgment, not just recall.</h1><p>These focused lessons deliberately emphasize difficult distinctions rather than repeating a full introductory course.</p><div class="cards">${DOMAINS.map((d,i)=>`<section class="card"><span class="pill">${d[1]}% of exam</span><h3>${i+1}. ${esc(d[0])}</h3><p>${esc(d[2])}</p>${action('Read & practice','chapter',i)}</section>`).join('')}</div>${foot()}`;wire()}
function chapter(i){const d=DATA[i];state.visited[i]=true;save();$('app').innerHTML=`<div class="chapterhead"><div class="eyebrow">Deep dive ${i+1} of 5 · ${DOMAINS[i][1]}% domain</div><h1>${esc(d.title)}</h1><p>${esc(d.take)}</p></div>${d.lessons.map((x,j)=>`<section class="lesson"><h3>${j+1}. ${esc(x[0])}</h3><p>${esc(x[1])}</p></section>`).join('')}<h2>Hear the difference</h2><div class="example">${d.dialogue.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="callout"><strong>⚠️ Exam trap</strong><p>${esc(d.trap)}</p><strong>Memory anchor: ${esc(d.anchor)}</strong></div><div class="toolbar">${action('Practice 10 scenarios','quiz',i)}${action('All chapters','chapters',undefined,'btn secondary')}</div>${foot()}`;wire()}
function qhtml(q,idx,mode){let a=mode==='mock'?state.mock.answers[q.id]:state.answers[q.id],checked=mode==='practice'&&state.checked[q.id];return `<article class="question" id="${q.id}"><div class="eyebrow">${mode==='mock'?'Mock exam':'Practice'} · Question ${idx+1}</div><h3>${esc(q.stem)}</h3><div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}" ${a===j?'checked':''} ${checked||mode==='mock'&&state.mock.submitted?'disabled':''}><span><strong>${'ABCD'[j]}.</strong> ${esc(o)}</span></label>`).join('')}</div>${mode==='practice'?`<div class="toolbar"><button class="btn secondary" data-check="${q.id}" ${a===undefined||checked?'disabled':''}>Check answer</button></div>${checked?feedback(q,a):''}`:state.mock.submitted?feedback(q,a):''}</article>`}
function feedback(q,a){return `<div class="feedback ${a===q.answer?'':'wrong'}"><strong>${a===q.answer?'✓ Correct':'Review this one'} · Best answer: ${'ABCD'[q.answer]}</strong><p>${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p></div>`}
function quiz(i){const list=qs('practice',i);$('app').innerHTML=`<div class="eyebrow">Chapter ${i+1} · Scenario practice</div><h1>${esc(DOMAINS[i][0])}</h1><p>These are original, unofficial practice questions. Choose one answer and tap <strong>Check answer</strong> to learn why it is the best choice. Answers are saved on this device.</p><div class="panel row between"><div><strong>${answered(i)}/10 checked</strong><div class="muted small">${correct(i)} correct</div></div><div class="toolbar">${action('Review lesson','chapter',i,'btn secondary')}<button class="btn outline" id="retry">Retry missed</button></div></div>${list.map((q,j)=>qhtml(q,j,'practice')).join('')}<div class="toolbar">${action('Next chapter',i===4?'mock':'chapter',i===4?undefined:i+1)}${action('Dashboard','home',undefined,'btn secondary')}</div>${foot()}`;wire();document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{state.answers[el.name]=+el.value;save();const b=document.querySelector(`[data-check="${el.name}"]`);if(b)b.disabled=false});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{state.checked[b.dataset.check]=true;save();quiz(i);document.getElementById(b.dataset.check)?.scrollIntoView({block:'start'})});$('retry').onclick=()=>{let missed=list.filter(q=>state.checked[q.id]&&state.answers[q.id]!==q.answer);if(!missed.length){alert('No checked questions to retry yet.');return}missed.forEach(q=>{delete state.answers[q.id];delete state.checked[q.id]});save();quiz(i)}}
function review(){const missed=qs('practice').filter(q=>state.checked[q.id]&&state.answers[q.id]!==q.answer);$('app').innerHTML=`<div class="eyebrow">Focused review</div><h1>Turn a miss into a skill.</h1><p>Instead of rereading everything, revisit the decision point that made a distractor tempting.</p>${missed.length?missed.map((q,i)=>`<section class="panel" style="margin:13px 0"><span class="pill">${esc(DOMAINS[q.domain][0])}</span><h3>${esc(q.stem)}</h3><p><strong>Your answer:</strong> ${esc(q.options[state.answers[q.id]])}</p><p><strong>Better answer:</strong> ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p>${action('Review this chapter','quiz',q.domain,'btn secondary')}</section>`).join(''):'<div class="panel"><h3>Nothing to review yet.</h3><p>Check some practice answers first. Missed questions will appear here automatically.</p></div>'}${foot()}`;wire()}
function mock(){let m=state.mock;let list=qs('mock'),count=Object.keys(m.answers).length;let score=list.filter(q=>m.answers[q.id]===q.answer).length;$('app').innerHTML=`<div class="eyebrow">Advanced assessment · 50 original questions</div><h1>Think like the examiner.</h1><p>These are <strong>50 new scenarios</strong>, distinct from chapter practice. The correct answers stay hidden until you submit. There is no official pass score implied here.</p>${!m.submitted?`<div class="panel"><strong>${count}/50 answered</strong><div class="meter"><span style="width:${count*2}%"></span></div><p class="small muted">Your selections are saved in this browser. You can leave and return.</p><label><input type="checkbox" id="timed" ${m.timed?'checked':''}> Optional timed practice (90-minute self-check)</label><p id="clock" class="focus"></p></div>${list.map((q,j)=>qhtml(q,j,'mock')).join('')}<div class="toolbar"><button class="btn" id="submit" ${count<50?'disabled':''}>Submit mock exam</button><button class="btn outline" id="restart">Restart mock</button></div>`:`<div class="panel"><div class="eyebrow">Your result</div><div class="stat">${score}/50</div><p>This is practice feedback, not an NBHWC score prediction.</p>${DOMAINS.map((d,i)=>`<p>${esc(d[0])}: <strong>${qs('mock',i).filter(q=>m.answers[q.id]===q.answer).length}/10</strong></p>`).join('')}<button class="btn" id="restart">Retake all 50</button></div><h2>Review each explanation</h2>${list.map((q,j)=>qhtml(q,j,'mock')).join('')}`}`;document.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{m.answers[el.name]=+el.value;save();mock();document.getElementById(el.name)?.scrollIntoView({block:'start'})});let timed=$('timed');if(timed){timed.onchange=()=>{m.timed=timed.checked;m.start=m.timed?Date.now():null;save();mock()};if(m.timed&&m.start){const elapsed=Math.floor((Date.now()-m.start)/60000);$('clock').textContent=`${Math.max(0,90-elapsed)} minutes remaining in your optional 90-minute target (not enforced).`}}if($('submit'))$('submit').onclick=()=>{if(Object.keys(m.answers).length!==50){alert('Answer all 50 questions before submitting.');return}m.submitted=true;save();mock();window.scrollTo(0,0)};if($('restart'))$('restart').onclick=()=>{if(confirm('Start a fresh mock exam? This will replace the current mock answers.')){state.mock={answers:{},submitted:false,timed:false,start:null};save();mock()}};}
const glossary=[['Autonomy','The client experiences choice and ownership.'],['Competence','The client experiences effectiveness and growing capability.'],['Relatedness','The client experiences connection and support.'],['Self-efficacy','Belief in one’s ability to perform a specific action.'],['Sustain talk','Language favoring the current behavior.'],['Change talk','Language favoring movement toward change.'],['Complex reflection','A tentative reflection that adds inferred meaning or feeling.'],['OARS','Open questions, affirmations, reflections, summaries.'],['Ask–offer–ask','Permission, concise information, client response.'],['Preparation stage','Intention to act soon plus practical steps.'],['Maintenance stage','Sustaining behavior and recovering from lapses.'],['SMART goal','Specific, measurable, achievable, relevant, time-bound.'],['Cultural humility','Continual curiosity, self-reflection and willingness to correct assumptions.'],['Scope of practice','Professional boundaries around services and clinical decisions.'],['DASH','Dietary Approaches to Stop Hypertension.']];
function tools(){let cards=DATA.map((d,i)=>`<section class="card"><span class="pill">Cheat sheet ${i+1}</span><h3>${esc(d.title)}</h3><p>${esc(d.anchor)}</p><p><strong>Most common trap:</strong> ${esc(d.trap)}</p></section>`).join('');$('app').innerHTML=`<div class="eyebrow">Quick reference</div><h1>Five cheat sheets & a practical glossary.</h1><p>Use these after class or immediately before a question set.</p><div class="cards">${cards}</div><h2>Search the glossary</h2><input id="search" class="search" placeholder="Try: change talk, OARS, scope…" aria-label="Search glossary"><div id="glossary"></div><h2>Official resources</h2><div class="panel"><p><a href="https://nbhwc.org/wp-content/uploads/2026/09/ADA-NBHWC-Content-Outline-2026-2030-2-2.pdf" target="_blank" rel="noopener">NBHWC 2026–2030 Content Outline</a></p><p><a href="https://nbhwc.org/code-of-ethics-and-professional-conduct/" target="_blank" rel="noopener">NBHWC Code of Ethics & Professional Conduct</a></p><p><a href="https://odphp.health.gov/moveyourway/" target="_blank" rel="noopener">U.S. Physical Activity Guidelines (Move Your Way)</a></p><p><a href="https://www.nhlbi.nih.gov/education/dash-eating-plan" target="_blank" rel="noopener">NIH DASH Eating Plan</a></p><p class="small muted">The outline and current ethics documents are the authoritative references. This independent companion emphasizes application and does not replace full official competency coverage.</p></div><h2>Progress & privacy</h2><div class="panel"><p>Your answers and progress are stored locally in this browser. They do not sync between devices or survive all browser data-clearing actions.</p><button class="btn outline" id="reset">Reset all study progress</button></div>${foot()}`;const render=(term='')=>{$('glossary').innerHTML=glossary.filter(g=>g.join(' ').toLowerCase().includes(term.toLowerCase())).map(g=>`<div class="lesson"><strong>${esc(g[0])}</strong><p>${esc(g[1])}</p></div>`).join('')||'<p>No matches found.</p>'};render();$('search').oninput=e=>render(e.target.value);$('reset').onclick=()=>{if(confirm('Erase ALL practice and mock-exam progress on this device?')){localStorage.removeItem(KEY);location.reload()}}}
function foot(){return `<footer class="footer">Original unofficial exam-preparation material. Not endorsed by NBHWC. Built as an application-focused supplement to your existing coursework. General education only, not individualized medical advice.</footer>`}
navigate('home');
</script></body></html>
